<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="productCard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="shopping-container">
      <!-- Main Cart Section -->
      <div class="cart-main">
        <h2 class="cart-title">Shopping Cart</h2>

        <!-- Grid for Header and Content -->
        <div class="cart-grid">
          <!-- Header -->
          <div class="cart-header">
            <div class="header-product">Product</div>
            <div class="header-price">Price</div>
            <div class="header-quantity">Quantity</div>
            <div class="header-subtotal">Total</div>
          </div>

          <!-- Product Row 1 -->
          <div class="product-row">
            <div class="product-info">
              <img
                src="https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?q=80&w=200&h=200&fit=crop"
                alt="4K Smart TV"
                class="product-image"
              />
              <div class="product-details">
                <h3>4K UHD LED Smart TV</h3>
                <p>with Chromecast Built-in</p>
              </div>
            </div>
            <div class="product-price">
              <span class="price-current">$10.00</span>
              <span class="price-old">$18.00</span>
            </div>
            <div class="product-quantity">
              <div class="quantity-control">
                <button class="minus-btn" aria-label="Decrease quantity">
                  <i class="fas fa-minus"></i>
                </button>
                <span class="quantity-value">1</span>
                <button class="plus-btn" aria-label="Increase quantity">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
            </div>
            <div class="product-subtotal">$10.00</div>
          </div>

          <!-- Product Row 2 -->
          <div class="product-row">
            <div class="product-info">
              <img
                src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=200&h=200&fit=crop"
                alt="Gaming Headphones"
                class="product-image"
              />
              <div class="product-details">
                <h3>Gaming Headphones</h3>
                <p>Wired Over-Ear with USB</p>
              </div>
            </div>
            <div class="product-price">$5.00</div>
            <div class="product-quantity">
              <div class="quantity-control">
                <button class="minus-btn" aria-label="Decrease quantity">
                  <i class="fas fa-minus"></i>
                </button>
                <span class="quantity-value">1</span>
                <button class="plus-btn" aria-label="Increase quantity">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
            </div>
            <div class="product-subtotal">$5.00</div>
          </div>
        </div>

        <!-- Footer Buttons -->
        <div class="cart-footer">
          <button
            class="return-btn"
            onclick="window.location.href='UserDashboard.html'"
          >
            <i class="fas fa-arrow-left"></i>
            Continue Shopping
          </button>
          <button class="update-btn">Update Cart</button>
        </div>
      </div>

      <!-- Sidebar Elements -->
      <div class="cart-sidebar">
        <!-- Cart Totals -->
        <div class="cart-totals">
          <h2>Cart Summary</h2>
          <div class="totals-content">
            <div class="total-row">
              <span>Subtotal</span>
              <span>$15.00</span>
            </div>
            <div class="total-row">
              <span>Shipping</span>
              <span>Free</span>
            </div>
            <div class="total-row">
              <span>Tax</span>
              <span>$2.70</span>
            </div>
            <hr />
            <div class="total-row final">
              <span>Total</span>
              <span>$17.70</span>
            </div>
            <button class="checkout-btn">
              Proceed to Checkout
              <i class="fas fa-arrow-right"></i>
            </button>
            <div class="secure-checkout">
              <i class="fas fa-lock"></i>
              Secure Checkout
            </div>
          </div>
        </div>

        <!-- Coupon Section -->
        <div class="coupon-section">
          <h2>Coupon Code</h2>
          <div class="coupon-content">
            <div class="coupon-input-wrapper">
              <input type="text" placeholder="Enter coupon code" />
              <button class="apply-btn">Apply Coupon</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="productCard.js"></script>
  </body>
</html>
