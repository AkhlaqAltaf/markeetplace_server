<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Category Carousel</title>
  <style>
    .custom-scrollbar::-webkit-scrollbar { display: none; }
    
    .category-card {
      transform: translateY(0);
      transition: all 0.3s ease;
    }
    
    .category-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.2);
    }
    
    .category-image {
      transition: transform 0.5s ease-in-out;
    }
    
    .category-card:hover .category-image {
      transform: scale(1.1);
    }
    
    .nav-button {
      opacity: 0.7;
      transition: all 0.3s ease;
    }
    
    .nav-button:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .category-border {
      border: 3px solid transparent;
      background: linear-gradient(45deg, #0B5D51, #2dd4ab) border-box;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div class="mt-12 flex flex-col gap-5 max-w-[1440px] mx-auto px-4">
    <h2 class="text-3xl font-bold text-center bg-gradient-to-r from-[#0B5D51] to-[#2dd4ab] text-transparent bg-clip-text">Shop with Categories</h2>
    
    <div class="relative">
      <button class="nav-button absolute left-0 top-1/2 -translate-y-1/2 -translate-x-4 z-10 bg-white rounded-full p-3 shadow-lg" onclick="scrollCategories(-1)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>

      <div id="scrollContainer" class="flex overflow-x-scroll custom-scrollbar gap-6 p-6 max-w-screen overflow-hidden">
        <div class="flex gap-6">
          {% for category in categories %}
            <a href="{% url 'product:category-product' category.id %}" 
               class="category-card flex flex-col items-center bg-[#0B5D51] p-1 rounded-full shadow-lg category-border overflow-hidden" 
               style="width: 180px; height: 180px;">
              <img src="{{ category.image.url }}" 
                   class="category-image w-full h-full object-cover rounded-full" />
            </a>
          {% endfor %}
        </div>
      </div>

      <button class="nav-button absolute right-0 top-1/2 -translate-y-1/2 translate-x-4 z-10 bg-white rounded-full p-3 shadow-lg" onclick="scrollCategories(1)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>
    </div>

    <div id="pagination" class="flex justify-center mt-4 space-x-2"></div>
  </div>

  <script>
    const container = document.getElementById('scrollContainer');
    const cards = document.querySelectorAll('a');
    const pagination = document.getElementById('pagination');
    const cardsPerPage = 5;
    let currentPage = 0;

    function scrollCategories(direction) {
      const cardWidth = 196; // 180px + 16px gap
      container.scrollBy({
        left: direction * cardWidth,
        behavior: 'smooth'
      });
    }

    function updatePagination() {
      const totalPages = Math.ceil(cards.length / cardsPerPage);
      pagination.innerHTML = '';
      
      for (let i = 0; i < totalPages; i++) {
        const dot = document.createElement('div');
        dot.className = `h-2 w-2 rounded-full ${i === currentPage ? 'bg-[#199f85]' : 'bg-gray-300'}`;
        pagination.appendChild(dot);
      }
    }

    container.addEventListener('scroll', () => {
      currentPage = Math.round(container.scrollLeft / (196 * cardsPerPage));
      updatePagination();
    });

    updatePagination();
  </script>
</body>
</html>
