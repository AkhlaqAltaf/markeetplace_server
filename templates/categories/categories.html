<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Category Carousel</title>
  <style>
    .custom-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div class="mt-12 flex flex-col gap-5 px-10">
    <h2 class="text-3xl font-semibold text-center">Shop with Categories</h2>
    
    <div class="relative">
      <button class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-4 z-10 bg-white rounded-full p-2 shadow-lg" onclick="scrollCategories(-1)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>

      <div id="scrollContainer" class="flex overflow-x-scroll custom-scrollbar space-x-4 p-4">
        <div class="flex gap-4">
          {% for category in categories %}
            <a href="{% url 'product:category-product' category.id %}" class="flex flex-col items-center bg-white border border-gray-300 p-3 rounded-full shadow-lg" style="min-width: 205px; height: 236px;">
              {% comment %} <img src="{{ category.image.url }}" class="mb-2 w-full h-4/5 object-cover rounded-full" style="max-height: 188px;" /> {% endcomment %}
              <p class="text-lg font-semibold">{{category.name}}</p>
            </a>
          {% endfor %}
        </div>
      </div>
      
      

      <button class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-4 z-10 bg-white rounded-full p-2 shadow-lg" onclick="scrollCategories(1)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>
    </div>

    <div id="pagination" class="flex justify-center mt-4 space-x-2"></div>
  </div>
  <script>
    const container = document.getElementById('scrollContainer');
    const cards = document.querySelectorAll('a');
    const pagination = document.getElementById('pagination');
    const cardsPerPage = 5;
    let currentPage = 0;

    function scrollCategories(direction) {
      const cardWidth = 221;
      container.scrollBy({
        left: direction * cardWidth,
        behavior: 'smooth'
      });
    }

    function updatePagination() {
      const totalPages = Math.ceil(cards.length / cardsPerPage);
      pagination.innerHTML = '';
      
      for (let i = 0; i < totalPages; i++) {
        const dot = document.createElement('div');
        dot.className = `h-2 w-2 rounded-full ${i === currentPage ? 'bg-blue-600' : 'bg-gray-300'}`;
        pagination.appendChild(dot);
      }
    }

    container.addEventListener('scroll', () => {
      currentPage = Math.round(container.scrollLeft / (221 * cardsPerPage));
      updatePagination();
    });

    updatePagination();
  </script>
</body>
</html>
