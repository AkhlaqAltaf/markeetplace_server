<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <style>
      /* Hide scrollbar for all browsers */
      #carousel::-webkit-scrollbar {
        display: none;
      }

      #carousel {
        -ms-overflow-style: none; /* IE & Edge */
        scrollbar-width: none; /* Firefox */
      }

      .testimonial-card {
        flex: 0 0 100%; /* Default: Show 1 card on mobile */
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        text-align: left;
        transition: transform 0.3s ease-in-out;
      }

      /* Tablet (2 cards) */
      @media (min-width: 640px) {
        .testimonial-card {
          flex: 0 0 calc(100% / 2 - 10px); /* 2 cards per row */
        }
      }

      /* Desktop (3 cards) */
      @media (min-width: 1024px) {
        .testimonial-card {
          flex: 0 0 calc(100% / 3 - 14px); /* 3 cards per row */
        }
      }

      /* Styling for heading and text */
      .testimonial-card h3 {
        font-size: 1.25rem;
        font-weight: bold;
      }
      .testimonial-card p {
        margin-top: 10px;
        color: #555;
      }
      .testimonial-card .stars {
        margin-top: 10px;
      }
      .testimonial-card .author {
        margin-top: 10px;
        font-weight: bold;
        color: #23646d;
      }

      /* Navigation Buttons */
      .nav-button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: white;
        color: #073741;
        padding: 10px 15px;
        border-radius: 50%;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        font-size: 20px;
        transition: background 0.3s;
      }
      .nav-button:hover {
        background: #ddd;
      }

      /* Marquee Animation */
      @keyframes marquee {
        0% {
          transform: translateX(100%);
        }
        100% {
          transform: translateX(-100%);
        }
      }
      .animate-marquee {
        display: inline-block;
        animation: marquee 40s linear infinite;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header
      class="absolute top-12 left-1/2 transform -translate-x-1/2 bg-white rounded-2xl shadow-md w-11/12 md:w-5/1 lg:w-3/4 p-2 flex justify-between items-center"
    >
      <div class="flex items-center space-x-2">
        <img src="images/v84_94.png" alt="Logo" class="w-12 h-12" />
      </div>
      <nav id="menu1" class="mx-auto hidden md:flex md:space-x-3 lg:space-x-6">
        <a href="#" class="lg-text-lg md-text-sm hover:text-[#0D9488]">Home</a>
        <a href="#" class="lg-text-lg md-text-sm hover:text-[#0D9488]">Shop</a>
        <a href="#" class="lg-text-lg md-text-sm hover:text-[#0D9488]"
          >Categories</a
        >
        <a href="#" class="lg-text-lg md-text-sm hover:text-[#0D9488]"
          >Contact Us</a
        >
        <a href="#" class="lg-text-lg md-text-sm hover:text-[#0D9488]"
          >About Us</a
        >
      </nav>
      <div class="flex space-x-4">
        <div
          class="w-8 h-8 bg-gray-300 hover:bg-[#0D9488] rounded-full flex items-center justify-center"
        >
          <i class="fa fa-search text-black"></i>
        </div>
        <div
          class="w-8 h-8 bg-gray-300 hover:bg-[#0D9488] rounded-full flex items-center justify-center"
        >
          <i class="fa fa-shopping-cart text-black"></i>
        </div>
        <div
          class="w-8 h-8 bg-gray-300 hover:bg-[#0D9488] rounded-full flex items-center justify-center"
        >
          <i class="fa fa-user text-black"></i>
        </div>
        <div
          class="w-8 h-8 bg-gray-300 hover:bg-[#0D9488] rounded-full flex items-center justify-center"
        >
          <i class="fa fa-heart text-black"></i>
        </div>
      </div>
      <div class="md:hidden">
        <button id="menu-btn" class="text-black text-2xl">
          <i class="fa fa-bars"></i>
        </button>
      </div>
    </header>

    <section
      id="bg-container"
      class="bg-cover bg-center min-h-screen flex flex-col items-center rounded-3xl mt-2 justify-center transition-all duration-700 w-[96%] mx-auto"
      style="background-image: url('../images/v84_120.png')"
    >
      <div
        id="mobile-menu"
        class="fixed left-0 w-full bg-white shadow-lg transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col items-center p-6 z-50"
      >
        <button
          id="close-menu"
          class="absolute top-4 right-6 text-3xl text-gray-700 hover:text-black"
        >
          <i class="fa fa-times"></i>
        </button>
        <nav class="flex flex-col items-center space-y-6 mt-12">
          <a href="#" class="lg-text-lg hover:text-[#0D9488]">Home</a>
          <a href="#" class="lg-text-lg hover:text-[#0D9488]">Shop</a>
          <a href="#" class="lg-text-lg hover:text-[#0D9488]">Categories</a>
          <a href="#" class="lg-text-lg hover:text-[#0D9488]">Contact Us</a>
          <a href="#" class="lg-text-lg hover:text-[#0D9488]">About Us</a>
        </nav>
      </div>

      <h1
        class="absolute top-1/2 text-5xl md:text-7xl font-extrabold text-white"
      >
        Be Stylish
      </h1>

      <div class="absolute bottom-10 flex space-x-2">
        <div
          class="w-4 h-4 bg-teal-700 rounded-full cursor-pointer"
          onclick="changeBackground(0)"
        ></div>
        <div
          class="w-4 h-4 bg-white rounded-full cursor-pointer"
          onclick="changeBackground(1)"
        ></div>
        <div
          class="w-4 h-4 bg-white rounded-full cursor-pointer"
          onclick="changeBackground(2)"
        ></div>
      </div>
    </section>
    <script src="./script.js"></script>
  </body>
</html>
