<button class="addToCartButton w-full flex gap-2 items-center justify-center rounded-md bg-white px-3 py-1 text-center text-xs font-medium text-[#23646D] focus:outline-none focus:ring-2 focus:ring-blue-300 shadow-md transition duration-300 ease-in-out transform hover:scale-105"

        data-quantity="1"
>

  <p class="font-sans font-normal text-sm">Add To Cart</p>
</button>
