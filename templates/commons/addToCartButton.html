<!-- In your addToCartButton.html -->
<button class="addToCartButton w-20 flex items-center justify-center rounded-md bg-[#0B5D51] px-3 py-2 text-center text-sm font-medium text-white hover:bg-[#073741] hover:text-white focus:outline-none focus:ring-4 focus:ring-blue-300 shadow-lg transition duration-300 ease-in-out transform hover:scale-105"
        data-product-id="{{ product.id }}"
        data-quantity="1"
>
    <i class="fa fa-shopping-cart"></i>
</button>

<!-- Red Popup Modal -->
<div id="cartPopup" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-red-500 rounded-lg p-6 w-80 text-center shadow-lg animate-slide-up">
        <div class="flex items-center justify-center mb-4">
            <i class="fa fa-shopping-cart text-white text-5xl"></i>
        </div>
        <h2 class="text-lg font-semibold text-white">Product Added to Cart!</h2>
        <p class="text-sm text-white mt-2">Your product has been successfully added to your shopping cart.</p>
        <button id="popupClose" class="mt-4 bg-white text-red-500 px-4 py-2 rounded-md shadow-md hover:bg-gray-200 focus:outline-none transition duration-300">
            Close
        </button>
    </div>
</div>

<script>
  // Attach event listeners to all "Add to Cart" buttons dynamically
  document.querySelectorAll('.addToCartButton').forEach(function(button) {
      button.addEventListener('click', function() {
          const productId = button.getAttribute('data-product-id');  // Get product ID from the button
          const quantity = button.getAttribute('data-quantity');  // Get quantity from the button

          // Construct the URL for the AddToCartView
          const url = `/product/addToCart/${productId}/${quantity}/`;

          // Send the POST request using fetch
          fetch(url, {
              method: 'POST',  // Use POST method
              headers: {
                  'Content-Type': 'application/json',  // Send JSON data
                  'X-CSRFToken': '{{ csrf_token }}',  // Include CSRF token for security
              },
              body: JSON.stringify({ 'product_id': productId, 'quantity': quantity })  // Request body
          })
          .then(response => response.json())
          .then(data => {
              if (data.success) {
                  // Show red popup on success
                  const popup = document.getElementById('cartPopup');
                  popup.classList.remove('hidden');
                  
                  // Auto-close popup after 3 seconds
                  setTimeout(() => {
                      popup.classList.add('hidden');
                  }, 3000);
              } else {
                  console.error('Error adding product to cart');
              }
          })
          .catch(error => {
              console.error('Error:', error);
          });
      });
  });

  // Close popup manually
  document.getElementById('popupClose').addEventListener('click', function() {
      document.getElementById('cartPopup').classList.add('hidden');
  });
</script>

<style>
  /* Add custom animation for popup (slide up effect) */
  @keyframes slide-up {
      0% {
          transform: translateY(50%);
          opacity: 0;
      }
      100% {
          transform: translateY(0);
          opacity: 1;
      }
  }

  .animate-slide-up {
      animation: slide-up 0.5s ease-out;
  }
</style>
