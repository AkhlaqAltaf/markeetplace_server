
<style>
        /* Default styles for the toggle button */
        #toggle-sidebar {
            position: sticky; /* Default to sticky */
            top: 80px; /* Adjust as needed */
            z-index: 20;
        }

        /* Media query for mobile devices */
        @media (max-width: 768px) {
            #toggle-sidebar {
                position: fixed; /* Change to fixed for mobile */
                right: 20px; /* Position it on the left */
                top: 100px;
            }

        }
          /* Scrollable categories */
        .category-filters {
            max-height: 40vh; /* Set a max height */
            overflow-y: auto; /* Enable vertical scrolling */
        }
    </style>
    <h1 class="text-2xl font-bold text-black md:hidden">Products</h1>

    <!-- Sidebar Toggle Button -->
    <button id="toggle-sidebar" class="p-2 text-black rounded-lg hover:bg-[#0B5D51] transition duration-300 focus:outline-none flex items-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
        <span class="text-lg font-medium">Filters</span>
    </button>

<!-- Sidebar -->
<div id="sidebar" class="fixed top-0 left-0 w-72 h-full bg-white shadow-lg transform -translate-x-full transition-transform duration-300 ease-in-out p-6 z-50">
    <!-- Close Button Inside Sidebar -->
    <button id="close-sidebar" class="absolute top-4 right-4 p-2 text-black rounded-full hover:bg-[#0B5D51] transition duration-300 focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>

    <!-- Sidebar Content -->
    <h3 class="text-xl font-semibold text-black mb-4">Filter Products</h3>

    <!-- Filter Form -->
        <form method="get" action="{% url 'product:all-product' %}" class="space-y-6">
        <!-- Category Filters -->
        <div class="category-filters space-y-2">
            <h4 class="font-medium text-lg text-black">Categories</h4>
            {% for category in categories %}
                <div class="border-b border-gray-300 pb-2 mb-2">
                    <h5 class="font-semibold text-md text-gray-800 cursor-pointer hover:text-[#0B5D51]">
                        <a href="{% url 'product:all-product' %}?filter={{ category.id }}&q={{ search_query }}&price={{ selected_price }}">
                            {{ category.name }}
                        </a>
                    </h5>
                    <ul class="ml-4 space-y-1">
                        {% for subcategory in category.subcategories.all %}
                            <li>
                                <a href="{% url 'product:all-product' %}?filter={{ category.id }}&filter={{ subcategory.id }}&q={{ search_query }}&price={{ selected_price }}" class="text-gray-600 hover:text-[#0D9488]">
                                    {{ subcategory.name }}
                                </a>
                            </li>
                        {% endfor %}
                    </ul> </div>
            {% endfor %}
        </div>

        <!-- Price Filters -->
        <div class="price-filters space-y-4">
            <h4 class="font-semibold text-lg text-black">Price Range</h4>
            <div class="flex space-x-2">
                <input type="number" name="min_price" placeholder="Min" class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:outline-none hover:ring-2 hover:ring-[#0B5D51] transition duration-300" min="0" step="0.01">
                <input type="number" name="max_price" placeholder="Max" class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:outline-none hover:ring-2 hover:ring-[#0B5D51] transition duration-300" min="0" step="0.01">
            </div>
        </div>

        <!-- Apply Filters Button -->
        <div class="flex justify-center">
            <button type="submit" class="w-full bg-[#FFFFFF] py-2 text-[#0B5D51] rounded-lg hover:bg-[#143b33] hover:text-white focus:outline-none transition duration-300">
                Apply Filters
            </button>
        </div>
    </form>

</div>

<!-- JavaScript for Sidebar Toggle -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleSidebar = document.getElementById("toggle-sidebar");
        const closeSidebar = document.getElementById("close-sidebar");
        const sidebar = document.getElementById("sidebar");

        // Toggle Sidebar on Button Click
        toggleSidebar.addEventListener("click", () => {
            sidebar.classList.toggle("-translate-x-full");
        });

        // Close Sidebar on Close Button Click
        closeSidebar.addEventListener("click", () => {
            sidebar.classList.add("-translate-x-full");
        });

        // Close Sidebar when clicking outside of it
        document.addEventListener("click", (event) => {
            if (!sidebar.contains(event.target) && !toggleSidebar.contains(event.target)) {
                sidebar.classList.add("-translate-x-full");
            }
        });
    });
</script>
