{% load static %}


<nav class="bg-[#073741] p-4 sm:px-24 flex items-center justify-between">
    <!-- Logo -->
    <a href="/">
        <img src="{% static 'assets/logo-2.png' %}" alt="Logo" class="h-10 sm:h-16">
    </a>

    <!-- Links and Cart (Always Visible) -->
    <div class="flex items-center gap-4 text-white">
        <!-- Search Form -->
        <form action="{% url 'product:search' %}" method="GET" class="relative">
            <input
                type="text"
                name="q"
                class="pl-4 pr-10 py-2 border border-green-300 rounded w-40 sm:w-64 focus:outline-none focus:ring-2 focus:ring-green"
                placeholder="Search for products"
                required>
            <button type="submit" class="absolute top-2 right-2 group">
                <i class="fa fa-search text-2xl transition-transform transform group-hover:scale-125 group-hover:text-green-700"></i>
            </button>
        </form>

        <!-- Cart Icon -->
        <a href="{% url 'cart:cart' %}" class="relative group">
            <i class="fa fa-shopping-cart text-2xl transition-transform transform group-hover:scale-125 group-hover:text-green-700"></i>
            {% if cart %}
            <span
                class="absolute -top-2 -right-3 bg-green-700 text-white rounded-full px-2 text-sm group-hover:bg-green-900 transition">
                {{ cart|length }}
            </span>
            {% endif %}
        </a>

        <!-- Wishlist Icon -->
        <a href="{% url 'wishlist:wish-list' %}" class="relative group">
            <i class="fa fa-heart text-2xl transition-transform transform group-hover:scale-125 group-hover:text-green-700"></i>
        </a>

        <!-- User Dropdown -->
        {% if request.user.is_authenticated %}
        <div class="relative">
            <button id="user-menu-toggle" class="flex items-center gap-2 focus:outline-none">
                <span>{{ request.user.name }}</span>
                <i id="dropdown-icon" class="fa fa-caret-down text-lg"></i>
            </button>
            <div id="user-menu" class="hidden absolute right-0 bg-[#073741] border border-white rounded shadow-lg mt-2 z-50">
                <a class="dropdown-item" href="#">Profile</a>
                <a class="dropdown-item" href="{% url 'order:user_order_list' %}">My Orders</a>
                <hr class="dropdown-divider">
                <a class="dropdown-item" href="{% url 'accounts:logout' %}">Logout</a>
            </div>
        </div>
        {% else %}
        <a href="{% url 'accounts:accounts' %}" class="relative group">
            <i class="fa fa-user text-2xl transition-transform transform group-hover:scale-125 group-hover:text-green-700"></i>
        </a>
        {% endif %}
    </div>

    <!-- Mobile Menu Button -->
    <button id="menu-toggle" class="sm:hidden text-white focus:outline-none">
        <i class="fa fa-bars text-xl"></i>
    </button>
</nav>

<style>
    .dropdown-item {
        color: white;
        padding: 10px 15px;
        transition: background-color 0.3s, color 0.3s;
    }

    .dropdown-item:hover {
        background-color: #004d4d;
    }

    .dropdown-divider {
        border-top: 1px solid #fff;
        margin: 10px 0;
    }


</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const userMenuToggle = document.getElementById('user-menu-toggle');
        const userMenu = document.getElementById('user-menu');

        if (userMenuToggle) {
            userMenuToggle.addEventListener('click', () => {
                userMenu.classList.toggle('hidden');
                        icon.classList.toggle('rotate-180');  // Rotates the caret icon

            });
        }
        const icon = document.getElementById('dropdown-icon');

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!userMenu.contains(e.target) && !userMenuToggle.contains(e.target)) {
                userMenu.classList.add('hidden');

            }
        });
    });
</script>
