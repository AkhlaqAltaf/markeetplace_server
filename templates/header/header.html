{% load static %}

<header id="navbar" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-white rounded-b-2xl shadow-md w-11/12 md:w-8/11 lg:w-3/4 p-2 flex justify-between items-center z-50 transition-all duration-300">
    <div class="flex items-center space-x-2">
        <a href="/"> 
            <img src="{% static 'assets/logo-2.png' %}" alt="Logo" class="w-12 h-12">
        </a>
    </div>
    <nav id="menu1" class="hidden md:flex md:space-x-3 lg:space-x-6">
        <a href="/" class="lg:text-lg md:text-sm hover:text-[#0D9488]">Home</a>
        <a href="{% url 'product:all-product' %}" class="lg:text-lg md:text-sm hover:text-[#0D9488]">Shop</a>
        <a href="#" class="lg:text-lg md:text-sm hover:text-[#0D9488]">Categories</a>
        <a href="{% url 'core:contact' %}" class="lg:text-lg md:text-sm hover:text-[#0D9488]">Contact Us</a>
        <a href="{% url 'core:about' %}" class="lg:text-lg md:text-sm hover:text-[#0D9488]">About Us</a>
    </nav>
    <div class="flex items-center space-x-2">
       <div class="relative">
    <input type="text" placeholder="Search" 
        class="w-40 sm:w-60 md:w-40 lg:w-60 border rounded-full py-1 px-1 md:px-4 lg:px-6 pl-10 focus:outline-none focus:ring-2 focus:ring-[#0D9488]">
</div>
        <a href="#" class="text-black text-xl md:text-2xl"><i class="fa fa-shopping-cart"></i></a>
        <a href="#" class="text-black text-xl md:text-2xl"><i class="fa fa-heart"></i></a>
        <div class="md:hidden">
            <button id="menu-btn" class="text-black text-2xl"><i class="fa fa-bars"></i></button>
        </div>
    </div>
</header>

<div id="mobile-menu" class="fixed left-0 top-1/4 w-full h-1/2 bg-[#A7C1C5]/90 shadow-lg transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col items-center justify-center p-6 z-50 rounded-lg">
    <button id="close-menu" class="absolute top-4 right-6 text-3xl text-gray-700 hover:text-black"><i class="fa fa-times"></i></button>
    <nav class="flex flex-col items-center space-y-6">
        <a href="#" class="lg:text-lg hover:text-[#0D9488]">Home</a>
        <a href="#" class="lg:text-lg hover:text-[#0D9488]">Shop</a>
        <a href="#" class="lg:text-lg hover:text-[#0D9488]">Categories</a>
        <a href="#" class="lg:text-lg hover:text-[#0D9488]">Contact Us</a>
        <a href="#" class="lg:text-lg hover:text-[#0D9488]">About Us</a>
    </nav>
</div>

<script>
    document.getElementById('menu-btn').addEventListener('click', function() {
        document.getElementById('mobile-menu').classList.remove('-translate-x-full');
        document.getElementById('mobile-menu').classList.add('translate-x-0');
    });

    document.getElementById('close-menu').addEventListener('click', function() {
        document.getElementById('mobile-menu').classList.remove('translate-x-0');
        document.getElementById('mobile-menu').classList.add('-translate-x-full');
    });
    // Navbar scroll effect
    window.addEventListener("scroll", function() {
        const navbar = document.getElementById("navbar");
        if (window.scrollY > 50) {
            navbar.classList.add("top-0", "left-0", "w-full", "rounded-none", "shadow-lg", "bg-[#A7C1C5]/90");
            navbar.classList.remove("top-4", "left-1/2", "-translate-x-1/2", "rounded-b-2xl", "w-11/12", "md:w-8/11", "lg:w-3/4", "bg-white");
        } else {
            navbar.classList.add("top-4", "left-1/2", "-translate-x-1/2", "rounded-b-2xl", "w-11/12", "md:w-8/11", "lg:w-3/4", "bg-white");
            navbar.classList.remove("top-0", "left-0", "w-full", "rounded-none", "shadow-lg", "bg-[#A7C1C5]/90");
        }
    });
</script>
