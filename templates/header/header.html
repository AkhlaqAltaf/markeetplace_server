{% load static %}
{% include 'header/script.html' %}
<header class="fixed  top-4 left-1/2 transform -translate-x-1/2 bg-white rounded-b-2xl shadow-md w-11/12 md:w-5/12 lg:w-3/4 p-2 flex justify-between items-center z-50">
    <div class="flex items-center space-x-2">
        <a href="/"> <img src="{% static 'assets/logo-2.png' %}" alt="Logo" class="w-12 h-12"></a>
    </div>
    <nav id="menu1" class="mx-auto hidden md:flex md:space-x-3 lg:space-x-6">
        <a href="/" class="lg:text-lg md:text-sm hover:text-[#0D9488]">Home</a>
        <a href="{% url 'product:all-product'%}" class="lg:text-lg md:text-sm hover:text-[#0D9488]">Shop</a>
        <a href="#" class="lg:text-lg md:text-sm hover:text-[#0D9488]">Categories</a>
        <a href="{% url 'core:contact' %}" class="lg:text-lg md:text-sm hover:text-[#0D9488]">Contact Us</a>
        <a href="{% url 'core:about' %}" class="lg:text-lg md:text-sm hover:text-[#0D9488]">About Us</a>

    <!-- User Authentication -->
    <div class="relative">
        {% if request.user.is_authenticated %}
            <!-- Logged-in User -->
            <button id="user-menu-btn" class="flex items-center space-x-2 px-3 py-2 rounded-md border border-gray-300 hover:bg-gray-100">
                <span class="font-semibold">{{ request.user.username }}</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>

            <!-- Dropdown Menu -->
            <div id="user-dropdown" class="absolute right-0 mt-2 w-40 bg-white rounded-md shadow-lg hidden">
                <a href="{% url 'order:user_order_list' %}" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Orders</a>
                <a href="{% url 'accounts:logout' %}" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Logout</a>
            </div>
        {% else %}
            <!-- Login Button -->
            <a href="{% url 'accounts:login' %}" class="px-4 py-2 bg-teal-600 text-white rounded-md hover:bg-teal-700">Login</a>
        {% endif %}
    </div>    </nav>
    <div class="flex space-x-4">
        <div class="w-8 h-8 bg-gray-300 hover:bg-[#0D9488] rounded-full flex items-center justify-center">
            <i class="fa fa-search text-black"></i>
        </div>
        <a href="{% url 'cart:cart' %}" class="relative group">
            <div class="w-8 h-8 bg-gray-300 hover:bg-[#0D9488] rounded-full flex items-center justify-center">
                <i class="fa fa-shopping-cart text-black"></i>
            </div>
                  {% if cart %}
      <span
        class="absolute -top-2 -right-3 bg-green-700 text-white rounded-full px-2 text-sm group-hover:bg-green-900 transition"
      >
        {{ cart.cart_length }}
      </span>
      {% endif %}
        </a>
        <a href="{% url 'wishlist:wish-list' %}" class="relative group">
            <div class="w-8 h-8 bg-gray-300 hover:bg-[#0D9488] rounded-full flex items-center justify-center">
                <i class="fa fa-heart text-black"></i>
            </div>
        </a>
        <a href="{% url 'accounts:accounts' %}" class="relative group">
            <div class="w-8 h-8 bg-gray-300 hover:bg-[#0D9488] rounded-full flex items-center justify-center">
                <i class="fa fa-bell text-black"></i>
            </div>
        </a>
    </div>
    <div class="md:hidden">
        <button id="menu-btn" class="text-black text-2xl"><i class="fa fa-bars"></i></button>
    </div>
</header>

    <div id="mobile-menu" class="bg-cover fixed left-0 w-full bg-white shadow-lg transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col items-center p-6 z-50">
        <button id="close-menu" class="absolute top-4 right-6 text-3xl text-gray-700 hover:text-black"><i class="fa fa-times"></i></button>
        <nav class="flex flex-col items-center space-y-6 mt-12">
            <a href="#" class="lg:text-lg hover:text-[#0D9488]">Home</a>
            <a href="#" class="lg:text-lg hover:text-[#0D9488]">Shop</a>
            <a href="#" class="lg:text-lg hover:text-[#0D9488]">Categories</a>
            <a href="#" class="lg:text-lg hover:text-[#0D9488]">Contact Us</a>
            <a href="#" class="lg:text-lg hover:text-[#0D9488]">About Us</a>
        </nav>

</div>
