{% load static %}

{% if top_sale %}
<div class="md:col-span-8 bg-[#F9FBFC] shadow-md hover:shadow-lg transition-shadow duration-300 ease-in-out rounded-lg flex flex-col md:flex-row items-center justify-between relative p-6 md:p-8">
  <!-- Banner Text -->
  <div class="flex flex-col gap-4 md:gap-6 w-full md:w-[356px]">
    <div class="flex gap-2 items-center">
      <div class="h-[1px] w-[25px] border-[2px] border-[#24B4C2] mx-2 md:mx-4"></div>
      <p class="text-[12px] md:text-[14px] font-semibold text-[#24B4C2] tracking-wider">THE BEST SALE ITEM</p>
    </div>
    <h1 class="text-[32px] md:text-[48px] font-bold text-[#073741] hover:text-[#082d35] transition-colors duration-300">{{ top_sale.name }}</h1>
    <p class="text-[16px] md:text-[18px] text-gray-600">{{ top_sale.description|slice:"30" }}</p>
    <a href="{% url 'product:product-detail' top_sale.id %}" 
       class="bg-[#073741] hover:bg-[#082d35] text-white hover:text-white font-bold w-[120px] md:w-[150px] h-[50px] md:h-[70px] py-2 md:py-3 flex items-center justify-center rounded-md transition-all duration-300">
      <span>Shop Now</span>
      <span class="ml-2 text-xl">→</span>
    </a>
  </div>

  <!-- Banner Image -->
  <div class="mt-6 md:mt-0 md:ml-6 w-full md:w-auto">
    <img src="{{ top_sale.media.first.file.url }}" alt="Xbox Console" 
         class="w-full h-auto rounded-lg hover:scale-105 transition-transform duration-300 ease-in-out" />
  </div>

  <!-- Price Badge -->
  <div class="absolute md:top-4 top-1 md:right-4 right-1 bg-[#2DA5F3] rounded-full w-[60px] md:w-[100px] h-[60px] md:h-[100px] flex items-center justify-center text-white font-bold shadow-md hover:shadow-lg transition-shadow duration-300">
    <span class="text-[18px] md:text-[18px]">{{ top_sale.price }}</span>
  </div>
</div>
{% endif %}
