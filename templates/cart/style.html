        <style>
      :root {
        --primary-color: #073741;
        --primary-hover: #052b33;
        --success-color: #10b981;
        --danger-color: #ef4444;
        --bg-color: #ffffff;
        --text-primary: #1a1f36;
        --text-secondary: #64748b;
        --border-color: #e2e8f0;
      }



      /* Container Styles */
      .main-container {
        max-width: 100%;
        margin: 40px auto;
        padding: 0 20px;
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 30px;
      }

      .checkout-container {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        margin: 0;
        max-width: none;
      }

      /* Section Titles */
      .section-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 20px;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section-title i {
        color: var(--primary-color);
      }

      /* Address Section */
      .address-section {
        margin-bottom: 30px;
      }

      .address-input-group {
        position: relative;
      }

      .address-input {
        width: 100%;
        padding: 14px 40px 14px 16px;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      .address-input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(7, 55, 65, 0.1);
      }

      /* Address Details */
  .address-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 20px;
    opacity: 1; /* Set to 1 to make it visible */
    height: auto; /* Set to auto to allow it to take its natural height */
    overflow: visible; /* Change to visible to show content */
    transition: all 0.3s ease; /* Keep the transition for smooth effects */
}

      .address-details input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: white;
      }

      .address-details input:hover {
        border-color: var(--primary-hover);
      }

      .address-details input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(7, 55, 65, 0.1);
      }

      .address-details input::placeholder {
        color: var(--text-secondary);
        opacity: 0.7;
      }

      .address-details.show {
        opacity: 1;
        height: auto;
        margin-top: 20px;
        animation: fadeIn 0.3s ease-in-out;
      }

      /* Location Button */
      .location-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--primary-color);
        cursor: pointer;
        font-size: 1.2rem;
        padding: 8px;
        transition: all 0.3s ease;
      }

      .location-btn:hover {
        color: var(--primary-hover);
        transform: translateY(-50%) scale(1.1);
      }

      /* Payment Section */
      .payment-section {
        margin-top: 30px;
      }

      .payment-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 15px;
      }

      .payment-option {
        padding: 20px;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
        background: white;
      }

      .payment-option:hover {
        border-color: var(--primary-color);
        transform: translateY(-2px);
      }

      .payment-option.selected {
        border-color: var(--primary-color);
        background: rgba(7, 55, 65, 0.05);
      }

      .payment-option i {
        font-size: 1.5rem;
        margin-bottom: 10px;
        color: var(--primary-color);
      }

      .payment-option-title {
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 5px;
      }

      .payment-option-desc {
        font-size: 0.85rem;
        color: var(--text-secondary);
      }

      /* Order Summary */
      .order-summary {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        height: fit-content;
      }

      .summary-title {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 20px;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .summary-items {
        margin-bottom: 20px;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid var(--border-color);
      }

      .summary-item-name {
        color: var(--text-primary);
        font-weight: 500;
      }

      .summary-item-price {
        color: var(--text-primary);
        font-weight: 600;
      }

      .summary-total {
        display: flex;
        justify-content: space-between;
        padding-top: 20px;
        border-top: 2px solid var(--border-color);
        margin-top: 20px;
        font-weight: 700;
        font-size: 1.1rem;
      }

      /* Button Styles */
      .proceed-btn {
        width: 100%;
        padding: 16px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .proceed-btn:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /* Loading State */
      .loading-address {
        position: relative;
      }

      .loading-address::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        animation: loading 1.5s infinite;
      }

      /* Responsive Adjustments */
  @media (max-width: 768px) {
    .main-container {
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-spacing: 0;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 8px;
      text-align: left;
    }

    .checkout-container,
    .order-summary {
      padding: 16px;
    }

    .payment-options {
      grid-template-columns: 1fr;
    }

    .proceed-btn {
      font-size: 0.9rem;
      padding: 12px;
    }
  }
    </style>
