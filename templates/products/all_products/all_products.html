{% extends 'core/base.html' %}

{% block content %}
<div class="container lg:mx-auto my-8 lg:px-6">
    <div class="flex flex-col lg:flex-row space-x-0 lg:space-x-6">
        <!-- Sidebar -->

       {% include 'commons/filter_side_bar.html' %}

        <!-- Product Grid Section -->
        <div class="w-full">
            <!-- Filter Button for Mobile and Tablet -->
            <div class="flex justify-end mb-4">
                <button id="toggle-sidebar" class="px-4 py-2 bg-[#0B5D51] text-white rounded-lg hover:bg-[#073741] transition duration-300">
                    Show Filters
                </button>
            </div>
            <div class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-6 gap-1 justify-items-center">
                {% for product, discount in products_with_discounts %}
                    {% include 'commons/product.html' %}
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- Pagination Section -->
    <div class="mt-8 flex justify-center">
        <nav class="inline-flex items-center space-x-4">
            <!-- Previous Button -->
            <a href="#"
               class="px-4 py-2 bg-[#0B5D51] text-white rounded-lg hover:bg-[#073741] hover:text-[#ffffff] transition duration-300 font-medium">
                <span class="flex items-center justify-center">Previous</span>
            </a>

            <!-- Page Numbers -->
            <span class="px-4 py-2 bg-gray-100 text-gray-700 font-semibold rounded-lg">
                Page 1 of 10
            </span>

            <!-- Next Button -->
            <a href="#"
               class="px-4 py-2 bg-[#0B5D51] text-white rounded-lg hover:bg-[#073741] hover:text-[#ffffff] transition duration-300 font-medium">
                <span class="flex items-center justify-center">Next</span>
            </a>
        </nav>
    </div>
</div>

<!-- JavaScript to Handle Sidebar Toggle -->
<script>
    const toggleSidebar = document.getElementById('toggle-sidebar');
    const closeSidebar = document.getElementById('close-sidebar');
    const sidebar = document.getElementById('sidebar');

    toggleSidebar.addEventListener('click', () => {
        sidebar.classList.toggle('-translate-x-full');
    });

    closeSidebar.addEventListener('click', () => {
        sidebar.classList.add('-translate-x-full');
    });
</script>
{% endblock %}
