{% extends 'core/base.html' %}

{% block content %}
<div class="flex flex-col lg:flex-row ">
    <!-- Sidebar -->

    <div id="sidebar-container" class="lg:w-1/4 w-full mt-10 ">

        {% include 'commons/filter_side_bar.html' %}
    </div>

    <!-- Product Grid and Pagination Section -->

       <div class="max-w-screen-screen md:px-20 mx-auto  my-10 ">

        <!-- Product Grid -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 md:gap-6">
            {% for product, discount in products_with_discounts %}
                {% include 'commons/product.html' %}
            {% endfor %}
        </div>

        <!-- Pagination Section -->
        <div class="mt-8 flex justify-center">
            <div class="flex items-center gap-8">
                <button disabled class="rounded-md border border-slate-900 p-2.5 text-center text-sm transition-all shadow-sm hover:shadow-lg text-slate-800 hover:text-white hover:bg-[#0B5D51] hover:border-slate-800 focus:text-white focus:bg-[#0B5D51] focus:border-slate-800 active:border-slate-800 active:text-white active:bg-[#0B5D51] disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none" type="button">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                    <path fill-rule="evenodd" d="M11.03 3.97a.75.75 0 0 1 0 1.06l-6.22 6.22H21a.75.75 0 0 1 0 1.5H4.81l6.22 6.22a.75.75 0 1 1-1.06 1.06l-7.5-7.5a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
                  </svg>
                </button>
               
                <p class="text-slate-600">
                  Page <strong class="text-slate-800">1</strong> of&nbsp;<strong class="text-slate-800">10</strong>
                </p>
                
                <button class="rounded-md border border-slate-900 p-2.5 text-center text-sm transition-all shadow-sm hover:shadow-lg text-slate-800 hover:text-white hover:bg-[#0B5D51] hover:border-slate-800 focus:text-white focus:bg-[#0B5D51] focus:border-slate-800 active:border-slate-800 active:text-white active:bg-[#0B5D51] disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none" type="button">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                    <path fill-rule="evenodd" d="M12.97 3.97a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 1 1-1.06-1.06l6.22-6.22H3a.75.75 0 0 1 0-1.5h16.19l-6.22-6.22a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                  </svg>
                </button>
              </div>
        </div>
    </div>
</div>
{% endblock %}
