<div class="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-6 md:px-12">
  <!-- Left Column -->
  {% if top_sale6 %}
  <div class="col-span-12 lg:col-span-4 bg-yellow-200 flex flex-col h-auto">
    <h6 class="text-red-500 text-sm text-center">{{ top_sale6.name }}</h6>
    <h1 class="text-2xl md:text-4xl text-center font-semibold">{{ top_sale6.discount_price }} Discount</h1>
    <p class="text-gray-600 text-center text-base">For all electr</p>

    <div class="flex items-center justify-center">
      <button class="bg-orange-500 text-white font-bold w-40 h-12 py-2 flex items-center justify-center gap-2">
        <span>Shop Now</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10.293 14.707a1 1 0 010-1.414L12.586 11H4a1 1 0 110-2h8.586l-2.293-2.293a1 1 0 111.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <div>
      <img src="../assets/Electronic.png" alt="Electronic" class="w-full md:w-auto md:mx-auto">
    </div>
  </div>
  {% endif %}

  <!-- Right Column -->
  <div class="col-span-12 lg:col-span-8 flex-col">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-4">
      <h3 class="text-lg font-semibold text-center">Featured Products</h3>
      <div class="flex flex-wrap justify-center gap-3 text-sm text-center">
        <a href="{% url 'product:all-product' %}" class="hover:underline hover:text-orange-500">All Products</a>
        {% for category in categories|slice:':4' %}
        <a href="{% url 'product:category-product' category.id %}" class="hover:underline hover:text-orange-500">
          {{ category.name }}
        </a>
        {% endfor %}
      </div>
    </div>
    
    <!-- Products Grid -->
    <div class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-6 gap-1 justify-items-center">
      {% for product in products %}
          {% include 'commons/product.html' %}
      {% endfor %}
    </div>
  </div>
</div>
