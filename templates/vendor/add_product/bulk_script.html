<script src="https://cdn.ckeditor.com/4.11.1/standard/ckeditor.js"></script>

<script>


    document.addEventListener("DOMContentLoaded", () => {
    const uploadFileInput = document.getElementById("uploadFile");
    const tableBody = document.querySelector("#productsTable tbody");
    const addRowButton = document.getElementById("addRowButton");
    const uploadToServerButton = document.getElementById("uploadToServer");

    function createEditableCell(className = "") {
        const td = document.createElement("td");
        td.className = `px-4 py-2 border ${className}`;
        td.contentEditable = true;
        return td;
    }

function createCkEditor(className = "") {
    const td = document.createElement("td");
    td.className = `px-4 py-2 border ${className}`;

    const inputField = document.createElement("textarea");
    inputField.name = 'content';
    inputField.id = `editor-${Date.now()}`; // Give a unique ID to the textarea

    // Append the textarea to the td
    td.appendChild(inputField);

    // Initialize CKEditor
    const editor = CKEDITOR.replace(inputField.id);

    // Set existing content if available
    const existingContent = `{{ form.content.value|safe }}`;
    if (existingContent.trim()) {
        editor.setData(existingContent);
    }

    return td;
}
    function createDropdownCell(optionsHtml) {
        const td = document.createElement("td");
        td.className = "px-4 py-2 border";
        const select = document.createElement("select");
        select.innerHTML = optionsHtml;
        td.appendChild(select);
        return td;
    }

    function createFileInputCell() {
        const td = document.createElement("td");
        td.className = "px-4 py-2 border";
        td.style.width = "250px";

        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.multiple = true;
        input.style.width = "100%";
        input.name = 'images';


        const previewContainer = document.createElement("div");
        previewContainer.id  = "imageStack";
        previewContainer.style.display = "flex";
        previewContainer.style.gap = "5px";
        previewContainer.style.marginTop = "5px";
        previewContainer.className = "flex space-x-4 mt-6 overflow-x-auto";


        td.appendChild(input);
        td.appendChild(previewContainer);

            input.addEventListener("change", handleImageUpload);

        return td;
    }


function handleImageUpload(event) {
    let imageStack = event.target.nextElementSibling;

    // Retrieve or initialize the image files list for this specific input
    if (!event.target.imageFiles) {
        event.target.imageFiles = [];
    }

    Array.from(event.target.files).forEach(file => {
        event.target.imageFiles.push(file); // Store files in input element

        const reader = new FileReader();
        reader.onload = ({ target }) => {
            const imageDiv = document.createElement("div");
            imageDiv.className = "relative w-24 h-24 flex-shrink-0";

            imageDiv.innerHTML = `
                <img src="${target.result}" alt="${file.name}" class="w-full h-full object-cover rounded-lg">
                <button class="absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center">✕</button>
            `;

            imageDiv.querySelector("button").addEventListener("click", () => {
                imageDiv.remove();
                event.target.imageFiles = event.target.imageFiles.filter(f => f !== file);
            });

            imageStack.appendChild(imageDiv);
        };
        reader.readAsDataURL(file);
    });

    event.target.value = ""; // Clear input to allow re-selection
}





function createOfferSection() {
        const offersTd = document.createElement("td");
        offersTd.className = "px-4 py-2 border";
        const offersContainer = document.createElement("div");
        offersContainer.className = "offers-container";
        offersTd.appendChild(offersContainer);

        const addOfferButton = document.createElement("button");
        addOfferButton.type = "button";
        addOfferButton.textContent = "+ Add Offer";
        addOfferButton.className = "bg-blue-500 text-white px-2 py-1 rounded mt-2";
        offersTd.appendChild(addOfferButton);

        addOfferButton.addEventListener("click", () => {
            const offerDiv = document.createElement("div");
            offerDiv.innerHTML = `
                <input name="discount_percentage" type="number" placeholder="Discount (%)" class="w-full border rounded p-1">
                <input name="min_quantity" type="number" placeholder="Min Quantity" class="w-full border rounded p-1">
                <input name="max_quantity" type="number" placeholder="Max Quantity" class="w-full border rounded p-1">
                <button type="button" class="remove-offer bg-red-500 text-white px-2 py-1 rounded mt-1">Remove</button>
            `;
            offersContainer.appendChild(offerDiv);

            offerDiv.querySelector(".remove-offer").addEventListener("click", () => offerDiv.remove());
        });

        return offersTd;
    }

function addRemoveButton(tr) {
    const removeButtonTd = document.createElement("td");
    removeButtonTd.className = "px-4 py-2 border";
    const removeButton = document.createElement("button");
    removeButton.textContent = "Remove";
    removeButton.className = "bg-red-500 text-white px-2 py-1 rounded";
    removeButton.addEventListener("click", () => {
        tr.remove(); // Remove the row
    });
    removeButtonTd.appendChild(removeButton);
    tr.appendChild(removeButtonTd);
}



function fetchSubcategories(categoryId, subcategoryDropdown) {
      subcategoryDropdown.innerHTML = '<option value="" disabled>Select Sub-Category</option>'; // Clear existing options
      fetch(`subcategory/${categoryId}/`)
        .then((response) => {
          if (!response.ok) throw new Error("Network response was not ok");
          return response.json();
        })
        .then((data) => {
          data.subcategories.forEach((subcategory) => {
            const option = document.createElement("option");
            option.value = subcategory.id;
            option.textContent = subcategory.name;
            subcategoryDropdown.appendChild(option);
          });
        })
        .catch((error) => console.error("Error fetching subcategories:", error));
    }



function addEmptyRow() {
    const tr = document.createElement("tr");
    tr.appendChild(createEditableCell()); // Name
    tr.appendChild(createDropdownCell(`
        <option value="" disabled selected>Select Brand</option>
        {% for brand in brands %}<option value="{{ brand.id }}">{{ brand.name }}</option>{% endfor %}
    `)); // Brand
    tr.appendChild(createEditableCell()); // Price
    tr.appendChild(createEditableCell()); // SKU
    tr.appendChild(createEditableCell()); // Barcode
    tr.appendChild(createEditableCell()); // Stock Quantity
    const categoryTd = createDropdownCell(`
        <option value="" disabled>Select Category</option>
        {% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}
    `);
    const subCategoryTd = createDropdownCell(`<option value="" disabled>Select Sub-Category</option>`);
    categoryTd.querySelector("select").addEventListener("change", () => {
        fetchSubcategories(categoryTd.querySelector("select").value, subCategoryTd.querySelector("select"));
    });
    tr.appendChild(categoryTd);
    tr.appendChild(subCategoryTd);
    tr.appendChild(createEditableCell()); // Summary
    tr.appendChild(createEditableCell()); // Description
    tr.appendChild(createFileInputCell()); // Images
    tr.appendChild(createOfferSection()); // Offers
    addRemoveButton(tr); // Add remove button to the row

    tableBody.appendChild(tr);
}

addRowButton.addEventListener("click", addEmptyRow);

uploadFileInput.addEventListener("change", () => {
    const file = uploadFileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        tableBody.innerHTML = ""; // Clear existing rows

        rows.forEach((row, rowIndex) => {
            if (rowIndex === 0 || row.length < 10) return; // Skip header or invalid rows
            const tr = document.createElement("tr");

            row.forEach((cell, index) => {
                const td = document.createElement("td");
                td.className = "px-4 py-2 border";
                td.contentEditable = ![1, 6, 7, 9].includes(index); // Disable for dropdowns
                td.textContent = cell;
                tr.appendChild(td);
            });

            const brandTd = tr.children[1];
            brandTd.innerHTML = "";
            brandTd.appendChild(createDropdownCell(`
                <option value="" disabled selected>Select Brand</option>
                {% for brand in brands %}<option value="{{ brand.id }}">{{ brand.name }}</option>{% endfor %}
            `).firstChild);

            const categoryTd = tr.children[6];
            categoryTd.innerHTML = "";
            categoryTd.appendChild(createDropdownCell(`
                <option value="" disabled>Select Category</option>
                {% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}
            `).firstChild);

            const subCategoryTd = tr.children[7];
            subCategoryTd.innerHTML = "";
            subCategoryTd.appendChild(createDropdownCell(`<option value="" disabled>Select Sub-Category</option>`).firstChild);

            tr.appendChild(createFileInputCell()); // Image upload
            tr.appendChild(createOfferSection()); // Offers
            addRemoveButton(tr); // Add remove button to the row

            // Attach change event for category dropdown
            categoryTd.querySelector("select").addEventListener("change", () => {
                fetchSubcategories(categoryTd.querySelector("select").value, subCategoryTd.querySelector("select"));
            });

            tableBody.appendChild(tr);
        });
    };
    reader.readAsArrayBuffer(file);
});


uploadToServerButton.addEventListener("click", () => {
  const tableRows = Array.from(document.querySelectorAll("#productsTable tbody tr"));
  const productsData = [];
  const errors = [];

  const promises = tableRows.map((row, rowIndex) => {
    const cells = Array.from(row.children);
    const imageInput = cells[10].querySelector("input[type='file']"); // Fetch the file input
    const imageFiles = imageInput.imageFiles || []; // Retrieve stored images

    const productData = {
      name: cells[0].textContent.trim(),
      brand: cells[1].querySelector("select").value,
      price: cells[2].textContent.trim(),
      sku: cells[3].textContent.trim(),
      barcode: cells[4].textContent.trim(),
      stock_quantity: cells[5].textContent.trim(),
      category: cells[6].querySelector("select").value,
      sub_category: cells[7].querySelector("select").value,
      summary: cells[8].textContent.trim(),
      description: cells[9].textContent.trim(),
      images: [],
      offers: []
    };

    // Convert images to base64
    const imagePromises = imageFiles.map(file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = ({ target }) => resolve(target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    }));

    return Promise.all(imagePromises)
      .then(encodedImages => {
        productData.images = encodedImages; // Store base64-encoded images
        productsData.push(productData); // Push product data into the array
      })
      .catch(error => console.error("Error encoding images:", error));
  });

  // Wait for all promises to resolve
  Promise.all(promises)
    .then(() => {
      // Now you can log productsData and it will include images
      console.log("🟢 Products Data Before Encoding:", productsData.at(0));

      productsData.forEach((product, index) => {
        console.log(`🔍 Product ${index} Images Before Encoding:`, product.images);
      });

      // Validate required fields
      productsData.forEach((product, rowIndex) => {
        if (!product.name || !product.price || !product.sku || !product.category || !product.sub_category) {
          errors.push(`Row ${rowIndex + 1}: All required fields must be filled.`);
        }

        // Validate price and stock quantity
        if (isNaN(product.price) || parseFloat(product.price) <= 0) {
          errors.push(`Row ${rowIndex + 1}: Price must be a positive number.`);
        }
        if (isNaN(product.stock_quantity) || parseInt(product.stock_quantity) < 0) {
          errors.push(`Row ${rowIndex + 1}: Stock quantity must be a non-negative integer.`);
        }

        // Check for unique SKU


      });

      // If there are errors, display them and do not send data
      if (errors.length > 0) {
        alert(errors.join("\n"));
        return;
      }

      // Send the products data to the server
      sendProductsData(productsData);
    })
    .catch(error => console.error("Error processing products:", error));
});

function sendProductsData(productsData) {

    const encodedData = productsData.map(product => ({
        ...product,
        images: Array.isArray(product.images) ? [...product.images] : []
    }));


fetch("{% url 'vendor:add_bulk' %}", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(encodedData),
})
.then(response => response.json())  // Ensure response is parsed as JSON
.then(data => {
    if (data.errors && data.errors.length > 0) {
        // Display errors from the backend
        let errorMessages = data.errors.map(err =>
            `Product: ${JSON.stringify(err.product)}, Errors: ${JSON.stringify(err.errors)}`
        ).join("\n");

        showMessage('error', `${data.message}\nErrors:\n${errorMessages}`);
    } else {
        showMessage('success', data.message);
        alert("Products uploaded successfully!");
    }
})
.catch(error => {
    showMessage('error', "Error uploading products: " + error);
    console.error("Error uploading products:", error);
});
}

});

</script>
