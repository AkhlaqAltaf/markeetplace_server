<script>
  document.addEventListener("DOMContentLoaded", () => {
    const uploadFileInput = document.getElementById("uploadFile");
    const tableBody = document.querySelector("#productsTable tbody");
    const uploadToServerButton = document.getElementById("uploadToServer");

    uploadFileInput.addEventListener("change", () => {
      const file = uploadFileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        tableBody.innerHTML = ""; // Clear existing rows

        rows.forEach((row, rowIndex) => {
          if (rowIndex === 0 || row.length < 10) return; // Skip header or invalid rows
          const tr = document.createElement("tr");

          row.forEach((cell, index) => {
            const td = document.createElement("td");
            td.className = "px-4 py-2 border";
            td.contentEditable = index !== 6 && index !== 7 && index !== 9 && index !==1; // Disable editing for dropdowns
            td.textContent = cell;
            tr.appendChild(td);
          });

          // Add dropdowns for category and subcategory
          const categoryTd = tr.children[6];
          const subCategoryTd = tr.children[7];

          const categorySelect = document.createElement("select");
          categorySelect.innerHTML = `
            <option value="" disabled>Select Category</option>
            {% for category in categories %}
              <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
          `;
          categorySelect.value = categoryTd.textContent.trim();
          categoryTd.textContent = "";
          categoryTd.appendChild(categorySelect);

          const subCategorySelect = document.createElement("select");
          subCategorySelect.innerHTML = `<option value="" disabled>Select Sub-Category</option>`;
          subCategoryTd.textContent = "";
          subCategoryTd.appendChild(subCategorySelect);

          // Add file input for multiple images
          const imageTd = document.createElement("td");
          imageTd.className = "px-4 py-2 border";
          const imageInput = document.createElement("input");
          imageInput.type = "file";
          imageInput.accept = "image/*";
          imageInput.multiple = true; // Allow multiple images
          imageInput.className = "w-full";
          imageTd.appendChild(imageInput);
          tr.appendChild(imageTd);

          // Add section for offers
          const offersTd = document.createElement("td");
          offersTd.className = "px-4 py-2 border";
          const offersContainer = document.createElement("div");
          offersContainer.className = "offers-container";
          offersTd.appendChild(offersContainer);
          const addOfferButton = document.createElement("button");
          addOfferButton.type = "button";
          addOfferButton.textContent = "+ Add Offer";
          addOfferButton.className = "bg-blue-500 text-white px-2 py-1 rounded mt-2";
          offersTd.appendChild(addOfferButton);
          tr.appendChild(offersTd);

            const brandTd = tr.children[1];
            brandTd.innerHTML = ""; // Completely remove any existing text content
            const brandSelect = document.createElement("select");
            brandSelect.innerHTML = `
              <option value="" disabled selected>Select Brand</option>
              {% for brand in brands %}
                <option value="{{ brand.id }}">{{ brand.name }}</option>
              {% endfor %}
            `;
            brandTd.appendChild(brandSelect);




          // Handle adding offers
          addOfferButton.addEventListener("click", () => {
            const offerDiv = document.createElement("div");
            offerDiv.innerHTML = `
              <input type="number" placeholder="Discount (%)" class="w-full border rounded p-1" name="discount_percentage">
              <input type="number" placeholder="Min Quantity" class="w-full border rounded p-1" name="min_quantity">
              <input type="number" placeholder="Max Quantity" class="w-full border rounded p-1" name="max_quantity">
              <button type="button" class="remove-offer bg-red-500 text-white px-2 py-1 rounded mt-1">Remove</button>
            `;
            offersContainer.appendChild(offerDiv);

            // Remove offer functionality
            offerDiv.querySelector(".remove-offer").addEventListener("click", () => {
              offerDiv.remove();
            });
          });

          // Fetch subcategories when category changes
          categorySelect.addEventListener("change", () => {
            fetchSubcategories(categorySelect.value, subCategorySelect);
          });

          tableBody.appendChild(tr);
        });
      };

      reader.readAsArrayBuffer(file);
    });

    function fetchSubcategories(categoryId, subcategoryDropdown) {
      subcategoryDropdown.innerHTML =
        '<option value="" disabled>Select Sub-Category</option>'; // Clear existing options
      fetch(`subcategory/${categoryId}/`)
        .then((response) => {
          if (!response.ok) throw new Error("Network response was not ok");
          return response.json();
        })
        .then((data) => {
          data.subcategories.forEach((subcategory) => {
            const option = document.createElement("option");
            option.value = subcategory.id;
            option.textContent = subcategory.name;
            subcategoryDropdown.appendChild(option);
          });
        })
        .catch((error) =>
          console.error("Error fetching subcategories:", error)
        );
    }

    uploadToServerButton.addEventListener("click", () => {
      const tableRows = Array.from(
        document.querySelectorAll("#productsTable tbody tr")
      );
      const productsData = [];
      const errors = [];

      tableRows.forEach((row, rowIndex) => {
        const cells = Array.from(row.children);
        const imageInputs = cells[10].querySelectorAll("input[type='file']"); // Image input fields
        const productData = {
          name: cells[0].textContent.trim(),
            brand: cells[1].querySelector("select").value,
          price: cells[2].textContent.trim(),
          sku: cells[3].textContent.trim(),
          barcode: cells[4].textContent.trim(),
          stock_quantity: cells[5].textContent.trim(),
          category: cells[6].querySelector("select").value,
          sub_category: cells[7].querySelector("select").value,
          summary: cells[8].textContent.trim(),
          description: cells[9].textContent.trim(),
          images: [],
          offers: []
        };

        // Validate required fields
        if (!productData.name || !productData.price || !productData.sku || !productData.category || !productData.sub_category) {
          errors.push(`Row ${rowIndex + 1}: All required fields must be filled.`);
        }

        // Validate price and stock quantity
        if (isNaN(productData.price) || parseFloat(productData.price) <= 0) {
          errors.push(`Row ${rowIndex + 1}: Price must be a positive number.`);
        }
        if (isNaN(productData.stock_quantity) || parseInt(productData.stock_quantity) < 0) {
          errors.push(`Row ${rowIndex + 1}: Stock quantity must be a non-negative integer.`);
        }

        // Check for unique SKU
        if (productsData.some(product => product.sku === productData.sku)) {
          errors.push(`Row ${rowIndex + 1}: SKU must be unique.`);
        }

        // Process multiple images
        imageInputs.forEach(input => {
          if (input.files.length > 0) {
            Array.from(input.files).forEach(file => {
              const reader = new FileReader();
              reader.onloadend = () => {
                productData.images.push(reader.result.split(",")[1]); // Store Base64 string
              };
              reader.readAsDataURL(file); // Read the file as Base64
            });
          }
        });

        // Process offers
        const offerElements = cells[11].querySelectorAll(".offers-container > div");
        offerElements.forEach(offer => {
          const discount = offer.querySelector("input[name='discount_percentage']").value;
          const minQuantity = offer.querySelector("input[name='min_quantity']").value;
          const maxQuantity = offer.querySelector("input[name='max_quantity']").value;
          productData.offers.push({ discount_percentage: discount, min_quantity: minQuantity, max_quantity: maxQuantity });
        });

        productsData.push(productData); // Push product data into the array
      });

      // If there are errors, display them and do not send data
      if (errors.length > 0) {
        alert(errors.join("\n"));
        return;
      }

      // Send the products data to the server
      sendProductsData(productsData);
    });

    function sendProductsData(productsData) {
        console.log(productsData)
      fetch("{% url 'vendor:add_bulk' %}", {
        method: "POST",

        body: JSON.stringify(productsData),

      })
      .then((response) => {
        if (!response.ok) throw new Error("Failed to upload products");
        return response.json();
      })
      .then((data) => {
        alert("Products uploaded successfully!");
        {#location.reload(); // Reload the page after successful upload#}
      })
      .catch((error) => console.error("Error uploading products:", error));
    }
  });
</script>
