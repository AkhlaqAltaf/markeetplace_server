<script>
    console.log("IMAGES...")
        {#console.log(`{{images}}`);#}

document.addEventListener("DOMContentLoaded", () => {
    // ========== Subcategory Dropdown ==========
    const categorySelect = document.getElementById("categorySelect");
    const subcategorySelect = document.getElementById("subcategorySelect");

    function fetchSubcategories(category) {
        if (!category) return;

        subcategorySelect.innerHTML = '<option value="" disabled selected>Select Sub-Category</option>';

    fetch(`{% url 'vendor:subcategory' '0' %}`.replace('0', category))
            .then(response => response.ok ? response.json() : Promise.reject("Network response was not ok"))
            .then(data => {
                data.subcategories.forEach(({ id, name }) => {
                    subcategorySelect.insertAdjacentHTML('beforeend', `<option value="${id}">${name}</option>`);
                });

                const selectedSubcategory = "{{ form.sub_category.value }}";
                if (selectedSubcategory) subcategorySelect.value = selectedSubcategory;
            })
            .catch(error => console.error("Error fetching subcategories:", error));
    }

    categorySelect.addEventListener("change", () => fetchSubcategories(categorySelect.value));
    if (categorySelect.value) fetchSubcategories(categorySelect.value);





    // ========== Image Upload ==========
    const uploadImagesInput = document.getElementById("uploadImages");
    let imageStack = document.getElementById('imageStack');
    let imagesInput = document.getElementById('imagesInput');
    // Decode and parse existing images
    let existingImages = JSON.parse('{{ images|safe }}') || [];
    if (!Array.isArray(existingImages)) {
        console.log("EMPTY LIST OF IMAGES...")
        existingImages = [];
    }
    else {
        console.log("NOT EMPTY.......")
    }

    function displayImage(imageSrc) {
        console.log("DISPLAY IMAGES...");
        console.log(existingImages);
        let imgWrapper = document.createElement('div');
        imgWrapper.classList.add('relative', 'w-24', 'h-24', 'flex-shrink-0');

        let img = document.createElement('img');
        img.src = imageSrc; // Directly use the base64 string
        img.classList.add('w-full', 'h-full', 'object-cover', 'rounded-lg');

        let removeBtn = document.createElement('a');

        removeBtn.innerHTML = "&times;";
        removeBtn.classList.add('absolute', 'top-0', 'right-0', 'bg-red-500', 'text-white', 'rounded-full', 'w-5', 'h-5', 'text-xs', 'flex', 'items-center', 'justify-center');
        removeBtn.onclick = function () {

        fetch(`{% url 'vendor:delete-image'%}`,{
                method: 'POST',

                body: new URLSearchParams({
                    'img_url': imageSrc,
                    'product':{{ form.instance.id }}
                })
            })
           .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => {
        console.log(data.success);
            imgWrapper.remove();
            existingImages = existingImages.filter(img => img !== imageSrc);
            imagesInput.value = JSON.stringify(existingImages);
    })
    .catch(error => {
        console.error('Error deleting image:', error);
    });

        };

        imgWrapper.appendChild(img);
        imgWrapper.appendChild(removeBtn);
        imageStack.appendChild(imgWrapper);
    }
    existingImages.forEach(imageSrc => displayImage(imageSrc));
    imagesInput.value = JSON.stringify(existingImages);





    let imageFiles = [];

    function handleImageUpload(event) {
        Array.from(event.target.files).forEach(file => {
            imageFiles.push(file);

            const reader = new FileReader();
            reader.onload = ({ target }) => {
                const imageDiv = document.createElement("div");
                imageDiv.className = "relative w-24 h-24 flex-shrink-0";

                imageDiv.innerHTML = `
                    <img src="${target.result}" alt="${file.name}" class="w-full h-full object-cover rounded-lg">
                    <button class="absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center">✕</button>
                `;

                imageDiv.querySelector("button").addEventListener("click", () => {
                    imageDiv.remove();
                    imageFiles = imageFiles.filter(f => f !== file);
                    updateImagesInput();
                });

                imageStack.appendChild(imageDiv);
            };
            reader.readAsDataURL(file);
        });

        event.target.value = "";
        updateImagesInput();
    }

    function updateImagesInput() {
        Promise.all(imageFiles.map(file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = ({ target }) => resolve(target.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        })))
        .then(data => imagesInput.value = JSON.stringify(data))
        .catch(error => console.error("Error encoding file:", error));
    }

    uploadImagesInput.addEventListener("change", handleImageUpload);

    // ========== Form Submission ==========
    document.getElementById("productForm").addEventListener("submit", () => console.log(imagesInput.value));

    // ========== Offer Section ==========
    const offerContainer = document.getElementById("offer-container");
    document.getElementById("addOfferButton").addEventListener("click", () => {
        const newOfferForm = document.createElement("div");
        newOfferForm.className = "offer-form";
        newOfferForm.innerHTML = `
            <label>Discount (%)</label>
            <input type="number" name="discount_percentage" class="w-full border rounded p-2" step="0.01">
            <label>Min Quantity</label>
            <input type="number" name="min_quantity" class="w-full border rounded p-2">
            <label>Max Quantity</label>
            <input type="number" name="max_quantity" class="w-full border rounded p-2">
            <button type="button" class="remove-offer bg-red-500 text-white px-2 py-1 rounded mt-2">Remove</button>
        `;
        offerContainer.appendChild(newOfferForm);
    });

    document.addEventListener("click", (event) => {
        if (event.target.classList.contains("remove-offer")) event.target.parentElement.remove();
    });

    // ========== CKEditor Initialization ==========

});



</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {

  });
</script>

<script src="https://cdn.ckeditor.com/4.11.1/standard/ckeditor.js"></script>
    <script>
    window.onload = function() {
            const editor = CKEDITOR.replace('content');

    // Populate CKEditor with existing content if available
    const existingContent = `{{ form.content.value|safe }}`;
    if (existingContent.trim()) {
        editor.setData(existingContent);
    }
    };
</script>
