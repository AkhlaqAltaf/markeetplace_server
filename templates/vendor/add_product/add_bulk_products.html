{% extends 'vendor/main/base.html' %}

{% block content %}
<div id="page" class="bg-gray-50 p-6">
  <div class="max-w-4xl mx-auto bg-white shadow-md p-6 rounded-lg">
    <h1 class="text-xl font-semibold mb-4">Upload Bulk Products</h1>

    <!-- File Upload -->
    <div class="mb-4">
      <label for="uploadFile" class="block text-sm font-medium mb-2">Upload File</label>
      <input
        id="uploadFile"
        type="file"
        accept=".xlsx, .xls"
        class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-orange-500"
      />
    </div>

    <!-- Editable Table -->
    <div class="overflow-x-auto">
      <table id="productsTable" class="table-auto w-full text-sm border border-gray-300 rounded-lg">
        <thead class="bg-gray-100">
          <tr>
            <th class="px-4 py-2 border">Name</th>
            <th class="px-4 py-2 border">Currency</th>
            <th class="px-4 py-2 border">Price</th>
            <th class="px-4 py-2 border">Discount Price</th>
            <th class="px-4 py-2 border">SKU</th>
            <th class="px-4 py-2 border">Stock Quantity</th>
            <th class="px-4 py-2 border">Category</th>
            <th class="px-4 py-2 border">Sub Category</th>
            <th class="px-4 py-2 border">Description</th>
            <th class="px-4 py-2 border">Country Origin</th>
            <th class="px-4 py-2 border">Image</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Upload to Server Button -->
    <div class="mt-6">
      <button
        id="uploadToServer"
        class="w-full py-2 bg-[#0B5D51] text-white font-semibold rounded-lg focus:outline-none focus:ring-2"
      >
        Upload to Server
      </button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.1/xlsx.full.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const uploadFileInput = document.getElementById("uploadFile");
    const tableBody = document.querySelector("#productsTable tbody");
    const uploadToServerButton = document.getElementById("uploadToServer");

    // Handle File Fetch and Populate Table
    uploadFileInput.addEventListener("change", () => {
      const file = uploadFileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        tableBody.innerHTML = ""; // Clear existing rows

        rows.forEach((row, rowIndex) => {
          if (rowIndex === 0 || row.length !== 10) return; // Skip header or invalid rows
          const tr = document.createElement("tr");

          row.forEach((cell, index) => {
            const td = document.createElement("td");
            td.className = "px-4 py-2 border";
            td.contentEditable = index !== 6 && index !== 7 && index !== 9; // Disable editing for dropdowns
            td.textContent = cell;
            tr.appendChild(td);
          });

          // Add dropdowns for category, subcategory, and origin
          const categoryTd = tr.children[6];
          const subCategoryTd = tr.children[7];
          const originTd = tr.children[9];

          const categorySelect = document.createElement("select");
          categorySelect.innerHTML = ` 
            <option value="" disabled>Select Category</option>
            {% for category in categories %}
              <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
          `;
          categorySelect.value = categoryTd.textContent.trim();
          categoryTd.textContent = "";
          categoryTd.appendChild(categorySelect);

          const subCategorySelect = document.createElement("select");
          subCategorySelect.innerHTML = `<option value="" disabled>Select Sub-Category</option>`;
          subCategoryTd.textContent = "";
          subCategoryTd.appendChild(subCategorySelect);

          const originSelect = document.createElement("select");
          originSelect.innerHTML = `
            <option value="" disabled>Select Country</option>
            {% for origin in origins %}
              <option value="{{ origin.id }}">{{ origin.name }}</option>
            {% endfor %}
          `;
          originSelect.value = originTd.textContent.trim();
          originTd.textContent = "";
          originTd.appendChild(originSelect);

          // Add file input for image column
          const imageTd = document.createElement("td");
          imageTd.className = "px-4 py-2 border";
          const imageInput = document.createElement("input");
          imageInput.type = "file";
          imageInput.accept = "image/*";
          imageInput.className = "w-full";
          imageTd.appendChild(imageInput);
          tr.appendChild(imageTd);

          // Fetch subcategories when category changes
          categorySelect.addEventListener("change", () => {
            fetchSubcategories(categorySelect.value, subCategorySelect);
          });

          tableBody.appendChild(tr);
        });
      };

      reader.readAsArrayBuffer(file);
    });

    function fetchSubcategories(categoryId, subcategoryDropdown) {
      subcategoryDropdown.innerHTML =
        '<option value="" disabled>Select Sub-Category</option>'; // Clear existing options
      fetch(`subcategory/${categoryId}/`)
        .then((response) => {
          if (!response.ok) throw new Error("Network response was not ok");
          return response.json();
        })
        .then((data) => {
          data.subcategories.forEach((subcategory) => {
            const option = document.createElement("option");
            option.value = subcategory.id;
            option.textContent = subcategory.name;
            subcategoryDropdown.appendChild(option);
          });
        })
        .catch((error) =>
          console.error("Error fetching subcategories:", error)
        );
    }

    document.getElementById("uploadToServer").addEventListener("click", () => {
  const tableRows = Array.from(
    document.querySelectorAll("#productsTable tbody tr")
  );
  const productsData = [];
  
  let filesProcessed = 0; // Keep track of processed files

  tableRows.forEach((row, index) => {
    const cells = Array.from(row.children);
    const imageInput = cells[10].querySelector("input[type='file']"); // Image input field
    const imageFile = imageInput.files[0]; // Selected image file (if any)

    let imageBase64 = null;
    const productData = {
      name: cells[0].textContent.trim(),
      currency: cells[1].textContent.trim(),
      price: cells[2].textContent.trim(),
      discount_price: cells[3].textContent.trim(),
      sku: cells[4].textContent.trim(),
      stock_quantity: cells[5].textContent.trim(),
      category: cells[6].querySelector("select").value,
      sub_category: cells[7].querySelector("select").value,
      description: cells[8].textContent.trim(),
      country_origin: cells[9].querySelector("select").value,
      image: null, // Initialize image field as null
    };

    // Process the image if selected
    if (imageFile) {
      const reader = new FileReader();
      reader.onloadend = () => {
        imageBase64 = reader.result.split(",")[1]; // Extract the Base64 string
        productData.image = imageBase64; // Assign the Base64 string to the productData

        productsData.push(productData); // Push product data into the array
        filesProcessed++; // Increment processed file count
        
        // Once all files are processed, send the data
        if (filesProcessed === tableRows.length) {
          sendProductsData(productsData); // Send the products data to the server
        }
      };
      reader.readAsDataURL(imageFile); // Start reading the image as Base64
    } else {
      // If no image, immediately push the product data
      productsData.push(productData);
      filesProcessed++; // Increment the processed file count

      // Once all rows are processed, send the data
      if (filesProcessed === tableRows.length) {
        sendProductsData(productsData);
      }
    }
  });

  // Function to send products data to the server
  function sendProductsData(productsData) {
    const formData = new FormData();

    // Append all products data to formData
    productsData.forEach((product, index) => {
      Object.keys(product).forEach((key) => {
        if (product[key] !== null) { // Only append if the value is not null
          formData.append(`products[${index}][${key}]`, product[key]);
        }
      });
    });

    // Check if formData is populated correctly
    console.log('FormData:', formData);

    // Send the data to the server
    fetch("{% url 'vendor:add_bulk' %}", {
      method: "POST",
      headers: {
        "X-CSRFToken": "{{ csrf_token }}",
      },
      body: formData,
    })
      .then((response) => {
        if (!response.ok) throw new Error("Failed to upload products");
        return response.json();
      })
      .then((data) => {
        alert("Products uploaded successfully!");
        console.log(data);
      })
      .catch((error) => console.error("Error uploading products:", error));
  }
});

  });
</script>
{% endblock %}
