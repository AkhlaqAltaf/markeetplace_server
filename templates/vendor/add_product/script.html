<script>

    // ========== Subcategory Dropdown ==========
    const categorySelect = document.getElementById("categorySelect");
    const subcategorySelect = document.getElementById("subcategorySelect");

    categorySelect.addEventListener("change", () => {
        const selectedCategory = categorySelect.value;

        // Clear existing options
        subcategorySelect.innerHTML = '<option value="" disabled selected>Select Sub-Category</option>';

        // Fetch subcategories from backend
        fetch(`subcategory/${selectedCategory}/`)
            .then((response) => {
                if (!response.ok) throw new Error("Network response was not ok");
                return response.json();
            })
            .then((data) => {
                // Populate subcategory dropdown
                data.subcategories.forEach((subcategory) => {
                    const option = document.createElement("option");
                    option.value = subcategory.id;
                    option.textContent = subcategory.name;
                    subcategorySelect.appendChild(option);
                });
            })
            .catch((error) => console.error("Error fetching subcategories:", error));
    });




    // ========== Image Upload ==========
    const uploadImagesInput = document.getElementById("uploadImages");
    const imageStack = document.getElementById("imageStack");
    const imagesInput = document.getElementById("imagesInput");

    const imageFiles = []; // Array to store files for submission

    function handleImageUpload(event) {
        const files = Array.from(event.target.files);

        files.forEach((file) => {
            // Store the file in our imageFiles array
            imageFiles.push(file);

            const reader = new FileReader();

            reader.onload = (e) => {
                const imageDiv = document.createElement("div");
                imageDiv.className = "relative w-24 h-24 flex-shrink-0";

                const img = document.createElement("img");
                img.src = e.target.result;
                img.alt = file.name;
                img.className = "w-full h-full object-cover rounded-lg";

                const deleteButton = document.createElement("button");
                deleteButton.className = "absolute top-1 right-1 bg-red-500 text-white text-xs rounded-full p-1 opacity-0 hover:opacity-100 transition-opacity";
                deleteButton.innerText = "✕";

                // Delete functionality
                deleteButton.addEventListener("click", () => {
                    // Remove from imageDiv
                    imageDiv.remove();

                    // Remove from imageFiles array
                    const index = imageFiles.indexOf(file);
                    if (index > -1) {
                        imageFiles.splice(index, 1);
                    }

                    // Update the hidden input with the updated array of files
                    updateImagesInput();
                });

                // Hover effects
                imageDiv.addEventListener("mouseenter", () => {
                    deleteButton.style.opacity = 1;
                });
                imageDiv.addEventListener("mouseleave", () => {
                    deleteButton.style.opacity = 0;
                });

                // Append elements
                imageDiv.appendChild(img);
                imageDiv.appendChild(deleteButton);
                imageStack.appendChild(imageDiv);
            };

            reader.readAsDataURL(file);
        });

        // Clear input value for re-uploading same files
        event.target.value = "";

        // Update the hidden input field initially
        updateImagesInput();
    }

    // Update the hidden input field with the current array of files
    function updateImagesInput() {
    const filePromises = imageFiles.map((file) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onload = function (event) {
                // The result is a base64 string
                resolve({
                    file: event.target.result, // Base64 encoded file
                });
            };

            reader.onerror = function (error) {
                reject(error);
            };

            // Read the file as a data URL (Base64 encoded string)
            reader.readAsDataURL(file);
        });
    });

    // Wait for all files to be processed and then set the input value
    Promise.all(filePromises)
        .then((fileArray) => {            
            imagesInput.value = JSON.stringify(fileArray); // Set the value to the JSON string
        })
        .catch((error) => {
            console.error('Error encoding file:', error);
        });
}


    const form = document.getElementById("productForm");
    form.addEventListener("submit", (e) => {
        // e.preventDefault();
        function logImagesData() {
            const imagesData = imagesInput.value;
            console.log(imagesData); // Parse and log the JSON data
        }

        logImagesData();

    })

    // Event listener for file input
    uploadImagesInput.addEventListener("change", handleImageUpload);
</script>
