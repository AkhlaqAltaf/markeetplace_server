<script>
    function closeMessage(element) {
        const messageContainer = document.getElementById('message-container');
        const message = element.parentElement;
        message.classList.add('fade-out');
        setTimeout(() => {
            messageContainer.removeChild(message);
        }, 300); // Match this with the CSS transition duration
    }

    // Automatically close messages after 2 seconds
    document.querySelectorAll('.message').forEach(message => {
        setTimeout(() => {
            closeMessage(message.querySelector('.delete'));
        }, 3000);
    });
</script>
<script>
// Attach event listeners to all "Add to Wishlist" buttons dynamically
document.querySelectorAll('.addToWishListButton').forEach(function(button) {
    button.addEventListener('click', function() {
        const productId = button.getAttribute('data-product-id');  // Get product ID from the button
        const quantity = button.getAttribute('data-quantity');  // Get quantity from the button

        // Construct the URL for the WishListProductsCreateView
        const url = `/wishlist/wishListCreate/${productId}/`;

        // Send the POST request using fetch
        fetch(url, {
            method: 'POST',  // Use POST method
            headers: {
                'Content-Type': 'application/json',  // Send JSON data
                'X-CSRFToken': '{{ csrf_token }}',  // Include CSRF token for security
            },
            body: JSON.stringify({ 'product_id': productId })  // Request body
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                location.reload();  // Reload the current page
            } else {
                // Handle error case
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    });
});

// Attach event listeners to all "Add to Cart" buttons dynamically
document.querySelectorAll('.addToCartButton').forEach(function(button) {
    button.addEventListener('click', function() {
        const productId = button.getAttribute('data-product-id');  // Get product ID from the button
        const quantity = button.getAttribute('data-quantity');  // Get quantity from the button

        // Construct the URL for the AddToCartView
        const url = `/cart/addToCart/${productId}/${quantity}/`;

        // Send the POST request using fetch
        fetch(url, {
            method: 'POST',  // Use POST method
            headers: {
                'Content-Type': 'application/json',  // Send JSON data
                'X-CSRFToken': '{{ csrf_token }}',  // Include CSRF token for security
            },
            body: JSON.stringify({ 'product_id': productId, 'quantity': quantity })  // Request body
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                location.reload();  // Reload the current page
            } else {
                // Handle error case
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    });
});
</script>
