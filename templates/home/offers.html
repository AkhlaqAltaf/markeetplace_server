{% load static %}
    <!-- Exclusive Offers Section -->
    <div class="max-w-screen-lg mx-auto text-center mt-10">
        <h2 class="text-2xl font-semibold">Here's Our</h2>
        <h1 class="text-4xl font-extrabold">EXCLUSIVE OFFERS</h1>
    </div>

    <!-- Product Grid -->
    <div class="max-w-screen-2xl md:px-20 mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">

        <!-- Large Product (Left) -->
        <div class="bg-[#D3E0E2] rounded-2xl p-4 shadow-md flex flex-col relative">
            <p class="text-[#23646D] text-sm">Category Name</p>
            <h2 class="font-bold text-md text-[#23646D]">Product Name</h2>
            <button class="mt-3 border-2 border-teal-600 text-teal-600 px-4 py-1.5 text-sm rounded-2xl w-2/3 md:w-2/6 hover:bg-teal-600 hover:text-white transition">SHOP NOW</button>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRFvQHFs96V-pQ57OuUM7AvMez9HDYC7q_p5A&s"
             alt="Product"
            class="w-38 h-38 object-cover mx-auto mt-3 rounded-lg mix-blend-multiply">
           <div class="absolute top-3 right-3 bg-white p-2 rounded-full shadow-md">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M7 17L17 7M17 7H7M17 7V17" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <!-- Right Side (Two Smaller Products) -->
        <div class="grid grid-cols-1 gap-4">

            <div class="bg-[#E9F0F1] rounded-2xl p-4 shadow-md flex flex-col relative">

                    </div>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRFvQHFs96V-pQ57OuUM7AvMez9HDYC7q_p5A&s"
                    alt="Product"
                    class="w-28 h-28 object-cover mx-auto mt-3 rounded-lg mix-blend-multiply">
                </div>
                <div class="absolute top-3 right-3 bg-white p-2 rounded-full shadow-md">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M7 17L17 7M17 7H7M17 7V17" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <div class="bg-[#E9F0F1] rounded-2xl p-4 shadow-md flex flex-col relative">
                <div class="flex flex-col md:flex-row md:items-center">
                    <div class="flex flex-col">
                        <p class="text-[#23646D] text-sm">Category Name</p>
                        <h2 class="font-bold text-md text-[#23646D]">Product Name</h2>
                        <button class="mt-3 border-2 border-teal-600 text-teal-600 px-4 py-1.5 text-sm rounded-2xl w-2/3 md:w-full hover:bg-teal-600 hover:text-white transition">SHOP NOW</button>
                    </div>
                    <img src="{% static 'images/v84_224.png' %}" alt="Product" class="w-28 h-28 object-cover mx-auto mt-3 rounded-lg">
                </div>
                <div class="absolute top-3 right-3 bg-white p-2 rounded-full shadow-md">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M7 17L17 7M17 7H7M17 7V17" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
